# Example trading policy (synthetic values). Copy to ~/.config/tradility/trading.toml and chmod 600.
# Nothing can be placed unless `enabled = true`. The file is re-read on every request, so setting
# it back to false stops trading immediately.
enabled = false

per_order_usd = 250        # reject any order whose cost is above this
daily_usd = 500            # reject an order that would push the day's total above this (UTC day)
price_band_pct = 3         # reject a limit price more than this far from the last price

# Only tickers listed here can be traded; BTC-USD style names route to Binance.US, the rest to Schwab.
# tickers = ["*"] allows any ticker (the dollar caps and price band still apply).
tickers = ["AAPL", "BTC-USD"]

# The order form starts as a good-till-cancelled limit order this far from the current mark.
[defaults]
confirmation = "phrase"      # "phrase": type e.g. BUY AAPL to send; "button": click Place order (cancels and withdrawals always need a phrase)
buy_offset_pct = -2.5
sell_offset_pct = 2.5
session = "extended"        # "normal" (regular hours) or "extended" (pre-market + after hours, Schwab SEAMLESS)
time_in_force = "gtc"       # "gtc" (good till cancelled) or "day"; extended hours need a limit order

[brokers]
schwab = true
binance = true

[schwab]
accounts = ["1234", "5678"]   # the last digits of each Schwab account that may be traded; each order names one

# Withdrawals (Binance.US only) are a separate switch, off by default. They go only to the addresses
# listed here, under their own caps, after a preview and a typed phrase. They need a different API key
# (withdrawals on, ideally limited to this machine's IP) behind TRADILITY_BINANCE_WITHDRAW_CREDENTIAL_COMMAND.
[withdrawals]
enabled = false
per_withdrawal_usd = 500
daily_withdrawal_usd = 1000

[[withdrawals.addresses]]
label = "cold wallet"
coin = "BTC"
network = "BTC"
address = "bc1q-example-address-not-real"

# One-click order shapes for the order form (buy under / sell over the current mark). Leave this out to get
# the built-in set: buy 1, 2, 4 and 8% under and sell 1, 2, 4 and 8% over. `tif` and `session` are optional.
[[templates]]
name = "Buy 2% under"
side = "buy"
offset_pct = -2

[[templates]]
name = "Sell 4% over, day"
side = "sell"
offset_pct = 4
tif = "day"

# Fidelity has no order API for individuals, so a Fidelity account only gets a prepared ticket: the order is
# checked against this policy and laid out in Fidelity's terms, and you submit it on Fidelity's own trade page.
# Name an account by its last four digits (add the type, e.g. "7866:hsa", when two accounts share the digits).
[fidelity]
accounts = ["4917"]
# "off": a ticket you submit yourself. "stage": the order is also filled in on Fidelity's website (in a browser
# profile you signed in to once: python -m tradility.fidelity_browser login) and Fidelity's own preview is checked
# against it, but never submitted. "submit": the final button can also be pressed, after a verified stage and your
# confirmation. This is unofficial, may breach Fidelity's terms and depends on the page's layout; start with "stage".
automation = "off"
