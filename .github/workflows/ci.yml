name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: casonk/.github/.github/workflows/python-ci.yml@main
    with:
      python-versions: auto-edges
      coverage: true
      coverage-source: tradility
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
