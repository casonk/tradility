          ${o.source && o.source !== 'manual' ? (o.status === 'open' && canTrade() ? `<button type="button" data-order-act="broker-cancel" data-id="${esc(o.id)}">Cancel at broker</button>` : '') : o.status === 'open' ? `<button type="button" data-order-act="cancel" data-id="${esc(o.id)}">Cancel</button>` : ''}
          ${o.source && o.source !== 'manual' ? '' : `<button type="button" data-order-act="delete" data-id="${esc(o.id)}" aria-label="Delete order">×</button>`}
        </td>
      </tr>`).join('');
    box.innerHTML = `
      <div class="orders-summary">
        <span>Quantity<strong>${pos.quantity == null ? '—' : esc(String(pos.quantity))}</strong></span>
        <span>Average entry<strong>${entry ? fmtPrice(entry) : '—'}</strong>${source || coverage ? ` <span>${source}${coverage}</span>` : ''}</span>
        <span>Vs last price<strong class="${pl == null ? '' : returnClass(pl)}">${pl == null ? '—' : formatReturn(pl)}</strong></span>
      </div>
      ${rows ? `<table class="orders-table"><thead><tr><th>Date</th><th>Side</th><th>Type</th><th class="num">Qty</th><th class="num">Price</th><th>Status</th><th>If this fills</th><th>Note</th><th>Source</th><th></th></tr></thead><tbody>${rows}</tbody></table>${openOrdersEffect()}`
             : '<p class="company-description">No orders recorded for this ticker.</p>'}
      <div id="held-box">${heldBox()}</div>
      ${tradeSection()}
      <div class="orders-sync">${syncNote()}</div>
      <form class="order-form" id="order-form" autocomplete="off">
        <select name="side" aria-label="Side"><option>buy</option><option>sell</option></select>
        <select name="kind" aria-label="Order type"><option>limit</option><option>market</option><option>stop</option><option value="stop_limit">stop limit</option></select>
        <input name="quantity" type="number" step="any" min="0" placeholder="Qty" aria-label="Quantity" required>
        <input name="price" type="number" step="any" min="0" placeholder="Price" aria-label="Price">
        <select name="status" aria-label="Status"><option>open</option><option>filled</option><option>cancelled</option></select>
        <input name="date" type="date" aria-label="Date" value="${new Date().toISOString().slice(0, 10)}">
        <input name="note" type="text" maxlength="120" placeholder="Note" aria-label="Note">
        <button type="submit">Add order</button>
      </form>
      <div class="order-error" id="order-error" role="alert"></div>`;
    box.querySelector('#order-form').addEventListener('submit', event => {
      event.preventDefault();
      const f = new FormData(event.target);
      submitOrder(() => sendOrder('POST', orderPath(), Object.fromEntries(f.entries())));
    });
    const tradeForm = box.querySelector('#trade-form');
    if (tradeForm) {
      tradeForm.addEventListener('submit', event => { event.preventDefault(); startPreview(tradeForm); });
      tradeForm.elements.side.addEventListener('change', fillDefaults);
      if (tradeForm.elements.session) {
        tradeForm.elements.session.addEventListener('change', () => syncOrderChoices(tradeForm));
        tradeForm.elements.tif.addEventListener('change', () => syncOrderChoices(tradeForm));
        syncOrderChoices(tradeForm);
      }
      if (tradeForm.elements.account) tradeForm.elements.account.addEventListener('change', async () => {
        if (!accountsData) await loadAccounts();
        showAccountFunds();
      });
      ['quantity', 'price'].forEach(name => tradeForm.elements[name].addEventListener('input', showAccountFunds));
      ['side', 'kind'].forEach(name => tradeForm.elements[name].addEventListener('change', showAccountFunds));
      if (isCrypto()) (accountsData ? Promise.resolve() : loadAccounts()).then(showAccountFunds);
      tradeForm.elements.kind.addEventListener('change', () => {
        tradeForm.elements.price.disabled = tradeForm.elements.kind.value === 'market';
        syncOrderChoices(tradeForm);
        fillDefaults();
      });
      if (tradeQuote && tradeQuote.ticker === detailTicker) { fillDefaults(); paintTemplates(); }
      else if (!tradeQuote) loadQuote();
      ensureTemplates().then(paintTemplates);
      paintPaneLadder();
    }
    const stage = box.querySelector('#fid-stage');
    if (stage) stage.addEventListener('click', stageOnFidelity);
    const fidSubmit = box.querySelector('#fid-submit');
    if (fidSubmit) fidSubmit.addEventListener('click', submitOnFidelity);
    const copy = box.querySelector('#fid-copy');
    if (copy) copy.addEventListener('click', copyTicket);
    const record = box.querySelector('#fid-record');
    if (record) record.addEventListener('click', recordFidelityOrder);
    const go = box.querySelector('#trade-go');
    if (go) go.addEventListener('click', sendStep);
    const discard = box.querySelector('#trade-discard');
    if (discard) discard.addEventListener('click', () => { tradeStep = null; renderOrders(); });
    box.querySelectorAll('[data-order-act]').forEach(button => button.addEventListener('click', () => {
      const id = button.dataset.id, act = button.dataset.orderAct;
      if (act === 'delete') submitOrder(() => sendOrder('DELETE', orderPath(id)));
      else if (act === 'broker-cancel') startBrokerCancel(id);
      else if (act === 'cancel') changeOrder(id, {status: 'cancelled'});
      else changeOrder(id, {status: 'filled', date: new Date().toISOString().slice(0, 10)});
    }));
  }

  // Price levels drawn across the chart: your average entry, and each open order's price.
  function chartLevels() {
    if (!detailOrders) return [];
    const levels = [];
    const entry = detailOrders.position && detailOrders.position.avg_entry;
    if (entry) levels.push({price: entry, label: `Avg entry ${fmtPrice(entry)}${detailOrders.position.partial ? ' (partial)' : ''}`, kind: 'entry'});
    for (const o of detailOrders.orders) {
      if (o.status === 'open' && o.price != null) {
        levels.push({price: o.price, label: `${o.side} ${o.kind.replace('_', ' ')} ${fmtPrice(o.price)}`, kind: 'order'});
      }
    }
    return levels;
  }

  // Round values on the price axis (1, 2, 2.5, 5 times a power of ten, at least three when a finer step
  // gives them) and calendar-aligned dates: days or weeks on a short range, months or years on a long one.
  const NICE_STEPS = [1, 2, 2.5, 5, 10];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function niceTicks(lo, hi, maxTicks) {
    const span = (hi - lo) || 1, mag = Math.pow(10, Math.floor(Math.log10(span / Math.max(1, maxTicks))));
    const steps = [...new Set([mag / 10, mag, mag * 10].flatMap(m => NICE_STEPS.map(n => Math.round(n * m * 1e9) / 1e9)))].sort((a, b) => a - b);
    const at = step => { const out = []; for (let k = Math.ceil(lo / step - 1e-9); k * step <= hi + step * 1e-6; k++) out.push(Math.round(k * step * 1e6) / 1e6); return out; };
    let pick = steps.find(st => at(st).length <= maxTicks) || steps[steps.length - 1];
    let ticks = at(pick);
    if (ticks.length < 3) { const finer = [...steps].reverse().find(st => st < pick && at(st).length >= 3); if (finer) { pick = finer; ticks = at(finer); } }
    return ticks;
  }
  function timeAxis(t0, t1, plotW) {
    const maxTicks = Math.max(2, Math.floor(plotW / 72)), days = (t1 - t0) / 864e5, out = [];
    if (days <= 120) {
      const step = [1, 2, 7, 14, 30].find(st => Math.ceil(days / st) <= maxTicks) || 30;
      for (let d = Math.ceil(t0 / 864e5 / step) * step; d * 864e5 <= t1; d += step) {
        const dt = new Date(d * 864e5);
        out.push({t: d * 864e5, label: `${MON[dt.getUTCMonth()]} ${dt.getUTCDate()}`});
      }
      return out;
    }
    const a = new Date(t0), b = new Date(t1);
    const o0 = a.getUTCFullYear() * 12 + a.getUTCMonth(), o1 = b.getUTCFullYear() * 12 + b.getUTCMonth();
    const step = [1, 2, 3, 6, 12, 24, 60, 120].find(st => Math.ceil((o1 - o0 + 1) / st) <= maxTicks) || 120;
    for (let o = Math.ceil(o0 / step) * step; o <= o1; o += step) {
      const y = Math.floor(o / 12), m = o % 12, t = Date.UTC(y, m, 1);
      if (t < t0 || t > t1) continue;
      out.push({t, label: step >= 12 ? String(y) : `${MON[m]}${m === 0 || !out.length ? ' ’' + String(y).slice(2) : ''}`});
    }
    return out;
  }

  function drawDetailChart() {
    const canvas = document.getElementById('detail-chart');
    if (!canvas || !detailRecord) return;
    const points = detailPointsForRange();
    const summary = document.getElementById('detail-chart-summary');
    if (points.length < 2) {
      summary.textContent = 'Not enough history for this range.';
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const width = Math.max(300, rect.width);
    const height = Math.max(220, rect.height);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    const pad = {left: 58, right: 12, top: 12, bottom: 28};
    const plotW = width - pad.left - pad.right;
    const plotH = height - pad.top - pad.bottom;
    const prices = points.map(point => point.close);
    let min = Math.min(...prices), max = Math.max(...prices);
    const pricePad = Math.max((max - min) * 0.08, max * 0.005, 0.01);
    min -= pricePad; max += pricePad;
    const levels = chartLevels();
    for (const level of levels) { min = Math.min(min, level.price - pricePad); max = Math.max(max, level.price + pricePad); }
    const t0 = points[0].date.getTime(), t1 = points[points.length - 1].date.getTime();
    const x = point => pad.left + (point.date.getTime() - t0) / Math.max(1, t1 - t0) * plotW;
    const y = point => pad.top + (max - point.close) / Math.max(0.000001, max - min) * plotH;
    const styles = getComputedStyle(document.documentElement);
    const muted = styles.getPropertyValue('--muted').trim() || '#8b949e';
    const border = styles.getPropertyValue('--border').trim() || '#30363d';
    const rising = points[points.length - 1].close >= points[0].close;
    const line = styles.getPropertyValue(rising ? '--green' : '--red').trim() || (rising ? '#3fb950' : '#f85149');

    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    const xTicks = timeAxis(t0, t1, plotW);
    ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.globalAlpha = 0.3;
    for (const tick of xTicks) {
      const xx = pad.left + (tick.t - t0) / Math.max(1, t1 - t0) * plotW;
      ctx.beginPath(); ctx.moveTo(xx, pad.top); ctx.lineTo(xx, pad.top + plotH); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const value of niceTicks(min, max, Math.max(3, Math.floor(plotH / 46)))) {
      const yy = pad.top + (max - value) / Math.max(0.000001, max - min) * plotH;
      ctx.strokeStyle = border; ctx.globalAlpha = 0.65; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(width - pad.right, yy); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = muted;
      ctx.fillText(fmtPrice(value), pad.left - 7, yy);
    }

    ctx.beginPath();
    points.forEach((point, index) => index ? ctx.lineTo(x(point), y(point)) : ctx.moveTo(x(point), y(point)));
    ctx.lineTo(x(points[points.length - 1]), pad.top + plotH);
    ctx.lineTo(x(points[0]), pad.top + plotH);
    ctx.closePath(); ctx.fillStyle = line; ctx.globalAlpha = 0.12; ctx.fill();
    ctx.globalAlpha = 1; ctx.beginPath();
    points.forEach((point, index) => index ? ctx.lineTo(x(point), y(point)) : ctx.moveTo(x(point), y(point)));
    ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    const tail = points[points.length - 1];
    if (tail.live) {
      ctx.beginPath(); ctx.arc(x(tail), y(tail), 4, 0, Math.PI * 2);
      ctx.fillStyle = line; ctx.fill();
      ctx.strokeStyle = styles.getPropertyValue('--bg').trim() || '#0d1117'; ctx.lineWidth = 2; ctx.stroke();
    }

    const accent = styles.getPropertyValue('--accent').trim() || '#58a6ff';
    const levelY = price => pad.top + (max - price) / Math.max(0.000001, max - min) * plotH;
    ctx.font = '10px ui-monospace, monospace';
    for (const level of levels) {
      const yy = levelY(level.price);
      ctx.save();
      ctx.strokeStyle = accent; ctx.fillStyle = accent; ctx.lineWidth = level.kind === 'entry' ? 1.6 : 1;
      ctx.setLineDash(level.kind === 'entry' ? [] : [5, 4]);
      ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(width - pad.right, yy); ctx.stroke();
      ctx.setLineDash([]); ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.fillText(level.label, width - pad.right - 2, yy - 2);
      ctx.restore();
    }
    ctx.fillStyle = muted; ctx.textBaseline = 'bottom';
    for (const tick of xTicks) {
      const xx = pad.left + (tick.t - t0) / Math.max(1, t1 - t0) * plotW;
      ctx.textAlign = xx < pad.left + 22 ? 'left' : xx > width - pad.right - 22 ? 'right' : 'center';
      ctx.fillText(tick.label, xx, height - 3);
    }
    const change = (points[points.length - 1].close - points[0].close) / points[0].close * 100;
    const calendarReturn = detailRecord.returns && detailRecord.returns[detailRange];
    const displayedReturn = calendarReturn == null ? change : Number(calendarReturn);
    summary.innerHTML = `<span>${points.length.toLocaleString()} observations · ${formatChartDate(points[0].date)} → ${formatChartDate(points[points.length - 1].date)}</span><strong class="${returnClass(displayedReturn)}">${formatReturn(displayedReturn)}</strong>`;
  }

  function fmtPrice(v) {
    if (v == null) return '—';
    if (v >= 1000) return '$' + v.toLocaleString(undefined, {maximumFractionDigits: 2});
    if (v >= 1)    return '$' + v.toFixed(2);
    if (v >= 0.01) return '$' + v.toFixed(4);
    return '$' + v.toFixed(6);
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Indicator settings panel ─────────────────────────────────────────────────
  const SETTINGS_KEY = 'tradility-indicator-settings';
  const SMA_PAIRS = ['20/50', '20/100', '50/100', '50/200', '100/200', '200/300'];
  const FUND_GROUP_LABELS = {
    valuation: 'Valuation (P/E, PEG)', profitability: 'Profitability (ROE, margin)',
    growth: 'Growth (revenue, earnings)', balance: 'Balance sheet (debt, liquidity, coverage)',
    short: 'Short interest',
  };
  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (_) { /* private mode */ }
  }
  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
      if (!saved || typeof saved !== 'object') return;
      for (const key of Object.keys(DEFAULT_SETTINGS)) {
        if (saved[key] && typeof saved[key] === 'object') Object.assign(settings[key], saved[key]);
      }
      settings.fund.groups = (settings.fund.groups || []).filter(g => g in FUND_GROUPS);
      if (!settings.fund.groups.length) settings.fund.groups = [...DEFAULT_SETTINGS.fund.groups];
    } catch (_) { /* unreadable settings fall back to the defaults */ }
  }
  function setting(path, value) {
    const [group, key] = path.split('.');
    settings[group][key] = value;
    applySettings();
  }
  function toggleFundGroup(group, on) {
    const next = new Set(settings.fund.groups);
    if (on) next.add(group); else next.delete(group);
    if (!next.size) { buildSettingsPanel(); return; }   // keep at least one group
    settings.fund.groups = Object.keys(FUND_GROUPS).filter(g => next.has(g));
    applySettings();
  }
  function resetSettings() {
    settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    buildSettingsPanel();
    applySettings();
  }
  function applySettings() {
    saveSettings();
    paintIndicatorButtons();
    paintLegend();
    renderGrid();
  }
  function selectHtml(path, current, options, suffix = '') {
    return `<select onchange="setting('${path}', Number(this.value))">${options.map(o =>
      `<option value="${o}" ${Number(o) === Number(current) ? 'selected' : ''}>${o}${suffix}</option>`).join('')}</select>`;
  }
  function buildSettingsPanel() {
    const s = settings;
    document.getElementById('ind-settings-body').innerHTML = `
      <div class="ind-set"><h4>RSI</h4><div class="ind-set-row">
        <label>Period ${selectHtml('rsi.period', s.rsi.period, [7, 14, 21], ' days')}</label>
        <label>Oversold at or below ${selectHtml('rsi.buy', s.rsi.buy, [20, 25, 30, 35, 40])}</label>
        <label>Overbought at or above ${selectHtml('rsi.sell', s.rsi.sell, [60, 65, 70, 75, 80])}</label>
      </div></div>
      <div class="ind-set"><h4>VWAP</h4><div class="ind-set-row">
        <label>Window ${selectHtml('vwap.window', s.vwap.window, [10, 20, 50], ' days')}</label>
        <label>Decisive beyond ±${selectHtml('vwap.band', s.vwap.band, [1, 3, 5, 10], '%')}</label>
      </div></div>
      <div class="ind-set"><h4>Trend</h4><div class="ind-set-row">
        <label>Averages <select onchange="const [a, b] = this.value.split('/').map(Number); settings.trend.short = a; settings.trend.long = b; applySettings();">${SMA_PAIRS.map(pair =>
          `<option value="${pair}" ${pair === s.trend.short + '/' + s.trend.long ? 'selected' : ''}>${pair}-day</option>`).join('')}</select></label>
        <label>Decisive gap ${selectHtml('trend.gap', s.trend.gap, [2, 5, 10], '%')}</label>
      </div></div>
      <div class="ind-set"><h4>Fundamentals</h4><div class="ind-set-row">
        ${Object.keys(FUND_GROUPS).map(g => `<label><input type="checkbox" ${s.fund.groups.includes(g) ? 'checked' : ''} onchange="toggleFundGroup('${g}', this.checked)">${FUND_GROUP_LABELS[g]}</label>`).join('')}
      </div><div class="ind-set-row">
        <label>Decisive when rules agree ${selectHtml('fund.agree', s.fund.agree, [50, 75, 100], '%')}</label>
      </div></div>
      <button type="button" class="ind-set-reset" onclick="resetSettings()">Reset to defaults</button>`;
  }
  loadSettings();
  buildSettingsPanel();
  paintIndicatorButtons();

  // Repaint legend after fonts/layout settle
  window.addEventListener('load', paintLegend);
  window.addEventListener('resize', () => {
    paintLegend();
    if (detailRecord) drawDetailChart();
  });
  document.getElementById('detail-overlay').addEventListener('click', event => {
    if (event.target.id === 'detail-overlay') closeTickerDetail();
  });
  document.addEventListener('keydown', event => {
    if (document.getElementById('detail-overlay').hidden) return;
    if (event.key === 'Escape') {
      if (!leaveFullScreen()) closeTickerDetail();
    } else if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && !event.altKey
               && !event.ctrlKey && !event.metaKey && !/^(INPUT|SELECT|TEXTAREA)$/.test(event.target.tagName)) {
      stepTickerDetail(event.key === 'ArrowLeft' ? -1 : 1);
    }
  });

  // ── Order templates: ladders ────────────────────────────────────────────────
  // A template is a side, hours, duration and rungs (a quantity and how far from the live price).
  // It is only data. Placing one asks the trader service, which expands it from its own live
  // price, checks every rung and the total against the trading policy, and sends nothing until
  // the typed phrase is given.
  let tplList = [], tplDraft = null, tplPreview = null, tplReady = null;
  const TPL_TIFS = [['gtc', 'GTC'], ['day', 'Day']];
  const TPL_SESSIONS = [['normal', 'Regular hours'], ['extended', 'Extended hours']];
  const tplBlank = () => ({id: '', name: '', side: 'buy', tif: 'gtc', session: 'normal',
    rungs: [{quantity: 1, offset_pct: -1}, {quantity: 2, offset_pct: -2}, {quantity: 3, offset_pct: -3}]});
  const tplSign = side => (side === 'sell' ? 1 : -1);
  // a rung's own side in a two-sided template, else the template's
  const rungSide = (d, r) => (d.side === 'both' ? r.side : d.side);
  const rungSign = (d, r) => tplSign(rungSide(d, r));
  const tplOptions = (choices, value) => choices.map(([v, label]) =>
    `<option value="${v}" ${v === value ? 'selected' : ''}>${label}</option>`).join('');
  const tplIsCoin = ticker => /-USD$/.test(ticker);

  function showView(view) {
    const templates = view === 'templates';
    document.body.classList.toggle('view-templates', templates);
    for (const [id, on] of [['tab-signals', !templates], ['tab-templates', templates]]) {
      const tab = document.getElementById(id);
      tab.setAttribute('aria-selected', String(on));
      tab.tabIndex = on ? 0 : -1;
    }
    try { history.replaceState(null, '', templates ? '#templates' : location.pathname + location.search); } catch (e) {}
    if (templates) tplReady = tplReady || initTemplates();
    return tplReady;
  }

  async function initTemplates() {
    tplDraft = tplDraft || tplBlank();
    renderBuilder();
    renderRun();
    await Promise.all([loadTemplates(), tradeStatus ? Promise.resolve() : loadTradeStatus()]);
    renderRun();
    renderImport();
  }

  async function openLadder(ticker) {
    if (typeof closeTickerDetail === 'function') closeTickerDetail();
    await showView('templates');
    const input = document.getElementById('run-ticker');
    if (input) { input.value = ticker; syncRunAccount(); input.focus(); }
  }

  async function loadTemplates() {
    try {
      const res = await fetch('/api/tradility-templates', {cache: 'no-store'});
      const data = await res.json();
      tplList = (res.ok && data.ok) ? data.templates : [];
    } catch (err) { tplList = []; }
    renderSaved();
    paintTemplates();
  }

  function rungText(r) { return `${Number(r.quantity)}×${Math.abs(Number(r.offset_pct))}%`; }
  function rungsText(t) {
    if (t.side !== 'both') return t.rungs.map(rungText).join(', ');
    return ['buy', 'sell'].map(side => `${side} ${t.rungs.filter(r => r.side === side).map(rungText).join(', ')}`).join(' · ');
  }

  // The order form's one-click shapes come from the trading policy (or the built-in set). They can be
  // imported as one-rung templates (quantity 1, to edit), so every template lives in one place.
  const tplPolicyMissing = () => {
    const have = new Set(tplList.map(t => t.name.toLowerCase()));
    return ((tradeStatus && tradeStatus.templates) || []).filter(t => !have.has(String(t.name).toLowerCase()));
  };

  function renderImport() {
    const box = document.getElementById('tpl-import');
    if (!box) return;
    const missing = tplPolicyMissing();
    box.innerHTML = missing.length ? `<p class="tpl-hint">The order form has ${missing.length} one-click template${missing.length === 1 ? '' : 's'} that are not saved here yet.</p>
      <button type="button" class="tpl-btn" id="tpl-import-go">Import ${missing.length} order-form template${missing.length === 1 ? '' : 's'}</button>
      <div class="order-error" id="tpl-import-error" role="alert"></div>` : '';
    const go = document.getElementById('tpl-import-go');
    if (go) go.addEventListener('click', importPolicyTemplates);
  }

  async function importPolicyTemplates() {
    const defaults = (tradeStatus && tradeStatus.defaults) || {};
    const error = document.getElementById('tpl-import-error');
    try {
      for (const t of tplPolicyMissing()) {
        await sendOrder('POST', '/api/tradility-templates', {
          name: t.name, side: t.side, tif: t.tif || defaults.time_in_force || 'gtc', session: t.session || defaults.session || 'normal',
          rungs: [{quantity: 1, offset_pct: Number(t.offset_pct)}],
        });
      }
    } catch (err) { if (error) error.textContent = err.message; }
    await loadTemplates();
  }

  const TPL_GROUPS = [
    {key: 'single-buy', label: 'Single buys'}, {key: 'single-sell', label: 'Single sells'},
    {key: 'ladder-buy', label: 'Buy ladders'}, {key: 'ladder-sell', label: 'Sell ladders'},
    {key: 'straddle', label: 'Straddles'}];
  const tplGroupOf = t => t.side === 'both' ? 'straddle' : `${t.rungs.length > 1 ? 'ladder' : 'single'}-${t.side}`;
  function tplClosedGroups() {
    try { return new Set(JSON.parse(localStorage.getItem('tradility.tplClosed') || '[]')); } catch (err) { return new Set(); }
  }

  function renderSaved() {
    renderImport();
    const box = document.getElementById('tpl-saved');
    const item = t => `<button type="button" class="tpl-item ${tplDraft && tplDraft.id === t.id ? 'active' : ''}" data-open="${esc(t.id)}">
        <strong>${esc(t.name)}</strong><span class="tpl-badge ${esc(t.side)}">${t.side === 'both' ? 'buy + sell' : esc(t.side)}</span>
        <small>${esc(rungsText(t))}</small></button>`;
    // one collapsible pane per strategy; the open/closed choice is remembered in this browser
    const groups = TPL_GROUPS.map(g => ({...g, items: tplList.filter(t => tplGroupOf(t) === g.key)})).filter(g => g.items.length);
    const closed = tplClosedGroups();
    box.innerHTML = tplList.length ? groups.map(g => `<details class="tpl-group" data-group="${g.key}" ${closed.has(g.key) && !g.items.some(t => tplDraft && tplDraft.id === t.id) ? '' : 'open'}>
        <summary>${esc(g.label)}<span class="tpl-count">(${g.items.length})</span></summary>
        <div class="tpl-group-body">${g.items.map(item).join('')}</div></details>`).join('')
      : '<div class="tpl-hint">No templates yet. Build one on the right and save it.</div>';
    box.querySelectorAll('details.tpl-group').forEach(d => d.addEventListener('toggle', () => {
      const set = tplClosedGroups();
      if (d.open) set.delete(d.dataset.group); else set.add(d.dataset.group);
      try { localStorage.setItem('tradility.tplClosed', JSON.stringify([...set])); } catch (err) { /* private mode: not remembered */ }
    }));
    box.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => {
      const t = tplList.find(x => x.id === b.dataset.open);
      if (t) { tplDraft = JSON.parse(JSON.stringify(t)); tplPreview = null; renderBuilder(); renderRun(); renderSaved(); }
    }));
  }

  function renderBuilder() {
    const d = tplDraft, box = document.getElementById('tpl-builder');
    const both = d.side === 'both';
    const word = both ? 'from' : (d.side === 'buy' ? 'below' : 'above');
    box.innerHTML = `<h2>${d.id ? 'Edit template' : 'New template'}</h2>
      <div class="order-form tpl-row">
        <input id="tpl-name" placeholder="Name, e.g. Dip ladder" maxlength="40" value="${esc(d.name)}" aria-label="Template name">
        <select id="tpl-side" aria-label="Side"><option value="buy" ${d.side === 'buy' ? 'selected' : ''}>buy</option><option value="sell" ${d.side === 'sell' ? 'selected' : ''}>sell</option><option value="both" ${both ? 'selected' : ''}>buy + sell (straddle)</option></select>
        <select id="tpl-session" aria-label="Trading hours">${tplOptions(TPL_SESSIONS, d.session)}</select>
        <select id="tpl-tif" aria-label="Duration">${tplOptions(TPL_TIFS, d.tif)}</select>
      </div>
      <div class="tpl-gen">Generate
        <input id="gen-count" type="number" min="1" max="20" value="3" aria-label="Rungs"> rungs${both ? ' on each side' : ''}, first
        <input id="gen-first" type="number" step="any" min="0" value="1" aria-label="First percent"> % ${both ? 'from the price' : word}, every
        <input id="gen-step" type="number" step="any" min="0" value="1" aria-label="Step percent"> %, first quantity
        <input id="gen-qty" type="number" step="any" min="0" value="1" aria-label="First quantity">, then +
        <input id="gen-qstep" type="number" step="any" min="0" value="1" aria-label="Quantity step"> each
        <button type="button" id="gen-go">Generate rungs</button></div>
      <table class="orders-table tpl-rungs"><thead><tr><th>#</th>${both ? '<th>Side</th>' : ''}<th>Quantity</th><th>% ${both ? 'from the price (buys below, sells above)' : word + ' the price'}</th><th></th></tr></thead><tbody>
        ${d.rungs.map((r, i) => `<tr><td>${i + 1}</td>
          ${both ? `<td><select data-rside="${i}" aria-label="Rung ${i + 1} side"><option value="buy" ${r.side === 'buy' ? 'selected' : ''}>buy</option><option value="sell" ${r.side === 'sell' ? 'selected' : ''}>sell</option></select></td>` : ''}
          <td><input type="number" step="any" min="0" data-rung="${i}" data-field="quantity" value="${esc(String(r.quantity))}" aria-label="Rung ${i + 1} quantity"></td>
          <td><input type="number" step="any" min="0" data-rung="${i}" data-field="pct" value="${esc(String(Math.abs(r.offset_pct)))}" aria-label="Rung ${i + 1} percent"></td>
          <td><button type="button" data-del="${i}" aria-label="Remove rung ${i + 1}">×</button></td></tr>`).join('')}
      </tbody></table>
      <p><button type="button" id="tpl-add">+ Add rung</button></p>
      <div class="orders-sync" id="tpl-summary"></div>
      <p><button type="button" class="primary" id="tpl-save">${d.id ? 'Save changes' : 'Save template'}</button>
        ${d.id ? '<button type="button" class="danger" id="tpl-delete">Delete</button>' : ''}</p>
      <div class="order-error" id="tpl-error" role="alert"></div>`;
    bindBuilder();
    updateSummary();
  }

  function updateSummary() {
    const d = tplDraft, el = document.getElementById('tpl-summary');
    if (!el) return;
    const qty = d.rungs.reduce((a, r) => a + (Number(r.quantity) || 0), 0);
    const deepest = Math.max(0, ...d.rungs.map(r => Math.abs(Number(r.offset_pct)) || 0));
    if (d.side === 'both') {
      const n = side => d.rungs.filter(r => r.side === side).length;
      el.textContent = `${n('buy')} buy${n('buy') === 1 ? '' : 's'} below + ${n('sell')} sell${n('sell') === 1 ? '' : 's'} above · ${qty} in total · deepest ${deepest}% from the price`;
      return;
    }
    el.textContent = `${d.rungs.length} rung${d.rungs.length === 1 ? '' : 's'} · ${qty} in total · deepest ${deepest}% ${d.side === 'buy' ? 'below' : 'above'} the price`;
  }

  function bindBuilder() {
    const d = tplDraft, box = document.getElementById('tpl-builder');
    const $ = id => document.getElementById(id);
    $('tpl-name').addEventListener('input', e => { d.name = e.target.value; });
    $('tpl-session').addEventListener('change', e => { d.session = e.target.value; });
    $('tpl-tif').addEventListener('change', e => { d.tif = e.target.value; });
    $('tpl-side').addEventListener('change', e => {
      const before = d.side, next = e.target.value, mirror = r => ({quantity: r.quantity, offset_pct: -r.offset_pct, side: r.side === 'buy' ? 'sell' : 'buy'});
      if (next === 'both') {
        const own = d.rungs.map(r => ({quantity: r.quantity, offset_pct: r.offset_pct, side: before}));
        d.rungs = [...own, ...own.map(mirror)];
      } else if (before === 'both') {
        const kept = d.rungs.filter(r => r.side === next).map(r => ({quantity: r.quantity, offset_pct: r.offset_pct}));
        d.rungs = kept.length ? kept : d.rungs.map(r => ({quantity: r.quantity, offset_pct: tplSign(next) * Math.abs(r.offset_pct)}));
      } else {
        d.rungs.forEach(r => { r.offset_pct = tplSign(next) * Math.abs(Number(r.offset_pct) || 0); });
      }
      d.side = next;
      tplPreview = null; renderBuilder(); renderRun();
    });
    box.querySelectorAll('[data-rside]').forEach(select => select.addEventListener('change', () => {
      const r = d.rungs[Number(select.dataset.rside)];
      r.side = select.value;
      r.offset_pct = rungSign(d, r) * Math.abs(Number(r.offset_pct) || 0);
      renderBuilder();
    }));
    box.querySelectorAll('[data-rung]').forEach(input => input.addEventListener('input', () => {
      const r = d.rungs[Number(input.dataset.rung)], v = Number(input.value);
      if (input.dataset.field === 'quantity') r.quantity = v; else r.offset_pct = rungSign(d, r) * Math.abs(v);
      updateSummary();
    }));
    box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      d.rungs.splice(Number(b.dataset.del), 1); renderBuilder();
    }));
    $('tpl-add').addEventListener('click', () => {
      const last = d.rungs[d.rungs.length - 1] || {quantity: 1, offset_pct: 0, side: 'buy'};
      const side = d.side === 'both' ? last.side : d.side;
      const added = {quantity: last.quantity, offset_pct: tplSign(side) * (Math.abs(last.offset_pct) + 1)};
      if (d.side === 'both') added.side = side;
      d.rungs.push(added);
      renderBuilder();
    });
    $('gen-go').addEventListener('click', () => {
      const n = Math.max(1, Math.min(d.side === 'both' ? 10 : 20, Math.floor(Number($('gen-count').value) || 1)));
      const first = Number($('gen-first').value) || 0, step = Number($('gen-step').value) || 0;
      const qty = Number($('gen-qty').value) || 0, qstep = Number($('gen-qstep').value) || 0;
      const round = x => Math.round(x * 1e6) / 1e6;
      const make = (side, i) => ({...(d.side === 'both' ? {side} : {}), quantity: round(qty + qstep * i), offset_pct: tplSign(side) * round(first + step * i)});
      d.rungs = d.side === 'both'
        ? [...Array.from({length: n}, (_, i) => make('buy', i)), ...Array.from({length: n}, (_, i) => make('sell', i))]
        : Array.from({length: n}, (_, i) => make(d.side, i));
      renderBuilder();
    });
    $('tpl-save').addEventListener('click', saveTemplate);
    if ($('tpl-delete')) $('tpl-delete').addEventListener('click', deleteTemplate);
  }

  function builderError(message) { const el = document.getElementById('tpl-error'); if (el) el.textContent = message || ''; }

  async function saveTemplate() {
    const d = tplDraft;
    builderError('');
    try {
      const body = {name: d.name, side: d.side, tif: d.tif, session: d.session, rungs: d.rungs};
      const data = await sendOrder(d.id ? 'PUT' : 'POST', d.id ? `/api/tradility-templates/${encodeURIComponent(d.id)}` : '/api/tradility-templates', body);
      tplDraft = JSON.parse(JSON.stringify(data.template));
      await loadTemplates();
      renderBuilder();
    } catch (err) { builderError(err.message); }
  }

  async function deleteTemplate() {
    const d = tplDraft;
    if (!d.id || !window.confirm(`Delete the template "${d.name}"?`)) return;
    try {
      await sendOrder('DELETE', `/api/tradility-templates/${encodeURIComponent(d.id)}`);
      tplDraft = tplBlank(); tplPreview = null;
      await loadTemplates(); renderBuilder(); renderRun();
    } catch (err) { builderError(err.message); }
  }

  function renderRun() {
    const box = document.getElementById('tpl-run');
    const d = tplDraft, current = document.getElementById('run-ticker');
    const typed = current ? current.value : '';
    const accounts = (tradeStatus && tradeStatus.schwab_accounts) || [];
    let status = '';
    if (!tradeStatus) status = '<div class="tpl-hint">Checking the trading service…</div>';
    else if (!tradeStatus.available) status = '<div class="order-error">The trading service is not running, so a ladder cannot be previewed.</div>';
    else if (!tradeStatus.enabled) status = '<div class="order-error">Trading is turned off in the policy.</div>';
    box.innerHTML = `<h2>Place this ladder</h2>${status}
      <form class="order-form" id="tpl-run-form" autocomplete="off">
        <input id="run-ticker" list="run-ticker-list" placeholder="Ticker, e.g. AAPL" value="${esc(typed)}" required aria-label="Ticker">
        <datalist id="run-ticker-list">${allTickers.map(t => `<option value="${esc(t.ticker)}">`).join('')}</datalist>
        <select id="run-account" aria-label="Schwab account"><option value="">Account…</option>${accounts.map(a => `<option value="${esc(a)}">…${esc(a)}</option>`).join('')}</select>
        <button type="submit" class="primary" ${tradeStatus && tradeStatus.available && tradeStatus.enabled ? '' : 'disabled'}>Preview ladder</button>
      </form>
      <div class="tpl-hint">${d ? `${esc(d.name || 'This template')} · ${d.rungs.length} rung${d.rungs.length === 1 ? '' : 's'}. ` : ''}Prices come from the live price when you preview; nothing is sent until you type the confirmation phrase.</div>
      <div class="order-error" id="run-error" role="alert"></div>
      <div id="tpl-preview"></div>`;
    document.getElementById('tpl-run-form').addEventListener('submit', e => { e.preventDefault(); previewLadder(); });
    document.getElementById('run-ticker').addEventListener('input', syncRunAccount);
    syncRunAccount();
    if (tplPreview) renderPreview();
  }

  function syncRunAccount() {
    const t = document.getElementById('run-ticker'), a = document.getElementById('run-account');
    if (t && a) a.hidden = tplIsCoin(t.value.trim().toUpperCase());
  }

  function runError(message) { const el = document.getElementById('run-error'); if (el) el.textContent = message || ''; }

  // The ladder preview and confirmation are shared by the Order templates tab and the trading pane in a
  // ticker's detail view. A "view" names where each piece lives and where its state is kept.
  let panePreview = null, paneResult = null;
  const LADDER_TAB = {box: 'tpl-preview', err: 'run-error', go: 'run-go', phrase: 'run-phrase', discard: 'run-discard',
    get: () => tplPreview, set: v => { tplPreview = v; }};
  const LADDER_PANE = {box: 'trade-ladder', err: 'trade-error', go: 'pane-go', phrase: 'pane-phrase', discard: 'pane-discard',
    get: () => panePreview, set: v => { panePreview = v; }};
  const viewError = (view, message) => { const el = document.getElementById(view.err); if (el) el.textContent = message || ''; };

  // The request the trader previews: the template's rungs (each with its side when two-sided) for a ticker.
  function ladderBody(d, ticker, account) {
    const body = {ticker, rungs: d.rungs.map(r => ({quantity: Number(r.quantity), offset_pct: Number(r.offset_pct), ...(d.side === 'both' ? {side: r.side} : {})}))};
    if (d.side !== 'both') body.side = d.side;
    if (!tplIsCoin(ticker)) Object.assign(body, {account, tif: d.tif, session: d.session});
    return body;
  }

  async function previewLadder() {
    runError(''); tplPreview = null;
    document.getElementById('tpl-preview').innerHTML = '';
    const d = tplDraft, ticker = document.getElementById('run-ticker').value.trim().toUpperCase();
    const account = document.getElementById('run-account').value;
    if (!ticker) { runError('Enter a ticker.'); return; }
    if (!tplIsCoin(ticker) && !account) { runError('Choose the Schwab account.'); return; }
    try {
      tplPreview = await sendOrder('POST', '/api/tradility-trade/batch/preview', ladderBody(d, ticker, account));
      renderPreview();
    } catch (err) { runError(err.message); }
  }

  function renderPreview(view = LADDER_TAB) {
    const p = view.get(), box = document.getElementById(view.box);
    if (!p || !box) return;
    const both = p.side === 'both', word = both ? 'from price' : (p.side === 'buy' ? 'below' : 'above');
    box.innerHTML = `<table class="orders-table"><thead><tr><th>#</th>${both ? '<th>Side</th>' : ''}<th class="num">Qty</th><th class="num">Limit</th><th class="num">% ${word}</th><th class="num">Cost</th><th></th></tr></thead><tbody>
      ${p.orders.map((o, i) => `<tr><td>${i + 1}</td>${both ? `<td class="tpl-side-${o.side === 'sell' ? 'sell' : 'buy'}">${esc(o.side)}</td>` : ''}<td class="num">${esc(String(o.quantity))}</td><td class="num">${fmtPrice(o.price)}</td>
        <td class="num">${Math.abs(o.offset_pct)}%</td><td class="num">${money(o.notional)}</td>
        <td>${(o.warnings || []).map(w => `<span class="trade-warn">${esc(w)}</span>`).join(' ')}</td></tr>`).join('')}
      <tr class="tpl-total"><td colspan="${both ? 5 : 4}">${both ? `${p.counts.buy} buys below + ${p.counts.sell} sells above` : `${p.count} ${esc(p.side)} orders`} on ${esc(p.ticker)} at a live price of ${fmtPrice(p.last_price)}</td><td class="num">${money(p.total_notional)}</td><td></td></tr>
      ${both ? `<tr><td colspan="${both ? 5 : 4}" class="tpl-hint">Buys ${money(p.notional_by_side.buy)} · sells ${money(p.notional_by_side.sell)}. Both sides count toward your limits, and the sells must be covered by what the account holds.</td><td></td><td></td></tr>` : ''}
      </tbody></table>
      <div class="orders-sync">Limits: ${money(p.limits.per_order_usd)} per order · ${money(p.limits.spent_today)} sent today of ${money(p.limits.daily_usd)} · ${money(p.limits.remaining_today)} left after this ladder.</div>
      ${(p.warnings || []).map(w => `<div class="trade-warn">${esc(w)}</div>`).join('')}
      <p>Type <strong>${esc(p.phrase)}</strong> to confirm. This sends ${p.count} real orders, and stops at the first one that fails.</p>
      <div class="order-form"><input type="text" id="${view.phrase}" autocomplete="off" aria-label="Confirmation phrase" style="max-width:200px">
        <button type="button" class="primary" id="${view.go}">Place ${p.count} orders</button>
        <button type="button" id="${view.discard}">Discard</button></div>`;
    document.getElementById(view.discard).addEventListener('click', () => { view.set(null); box.innerHTML = ''; viewError(view, ''); });
    document.getElementById(view.go).addEventListener('click', () => confirmLadder(view));
    document.getElementById(view.phrase).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); confirmLadder(view); } });
  }

  async function confirmLadder(view = LADDER_TAB) {
    const p = view.get();
    if (!p) return;
    viewError(view, '');
    const phrase = document.getElementById(view.phrase).value;
    document.getElementById(view.go).disabled = true;
    try {
      const done = await sendOrder('POST', '/api/tradility-trade/batch/confirm', {preview_id: p.preview_id, phrase});
      view.set(null);
      renderResults(done, p, view);
    } catch (err) {
      // a refused confirmation uses the preview up, so the ladder has to be previewed again
      view.set(null);
      document.getElementById(view.box).innerHTML = '';
      viewError(view, `${err.message} Preview the ladder again to retry.`);
    }
  }

  function renderResults(done, p, view = LADDER_TAB) {
    const icon = {placed: '✓ placed', failed: '✗ failed', skipped: '– not sent'};
    const html = `
      <div class="${done.placed ? 'tpl-result-ok' : 'tpl-result-bad'}">${done.placed
        ? `All ${done.count} orders placed on ${esc(p.ticker)}.`
        : `Stopped after ${done.placed_count} of ${done.count} orders. The ones placed are still open; the rest were not sent.`}</div>
      <table class="orders-table"><thead><tr><th>#</th><th>Side</th><th class="num">Qty</th><th class="num">Limit</th><th>Result</th></tr></thead><tbody>
      ${done.results.map(r => `<tr><td>${r.index}</td><td>${esc(r.order.side)}</td><td class="num">${esc(String(r.order.quantity))}</td><td class="num">${fmtPrice(r.order.price)}</td>
        <td class="${r.status === 'placed' ? 'tpl-result-ok' : r.status === 'failed' ? 'tpl-result-bad' : ''}">${icon[r.status] || esc(r.status)}${r.error ? ' — ' + esc(r.error) : ''}${r.broker_order_id ? ' (' + esc(String(r.broker_order_id)) + ')' : ''}</td></tr>`).join('')}
      </tbody></table>`;
    document.getElementById(view.box).innerHTML = html;
    if (view === LADDER_PANE) paneResult = {ticker: p.ticker, html};  // kept across the pane's re-renders
  }

  // ── Saved templates in the trading pane ──────────────────────────────────────
  // Every saved template is a chip in the pane's order ticket (the policy's one-click shapes appear too
  // until they are saved). A single-order template fills the form as the one-click shapes always did; a
  // ladder or straddle previews right here for the account chosen above, with the same typed confirmation.
  let tplLoadedOnce = false, paneList = [];
  const tplIsLadder = t => t.side === 'both' || t.rungs.length > 1;

  async function ensureTemplates() {
    if (tplLoadedOnce) return;
    tplLoadedOnce = true;
    await loadTemplates();
  }

  function paneItems() {
    const saved = new Set(tplList.map(t => t.name.toLowerCase()));
    return [...tplList.map(t => ({saved: t})),
            ...((tradeQuote && tradeQuote.templates) || []).filter(q => !saved.has(String(q.name).toLowerCase())).map(q => ({policy: q}))];
  }

  const paneRungPrice = (mark, offset) => Number((mark * (1 + offset / 100)).toFixed(mark >= 1 ? 2 : 6));

  function paneChip(i) {
    const it = paneList[i];
    if (it.policy) return `<button type="button" class="${esc(it.policy.side)}" data-pick="${i}" title="${esc(it.policy.side)} limit at ${fmtPrice(it.policy.price)}">${esc(it.policy.name)}</button>`;
    const t = it.saved;
    if (tplIsLadder(t)) return `<button type="button" class="${esc(t.side)}" data-pick="${i}" title="${esc(rungsText(t))}">${esc(t.name)}</button>`;
    const price = paneRungPrice(tradeQuote.mark, Number(t.rungs[0].offset_pct));
    return `<button type="button" class="${esc(t.side)}" data-pick="${i}" title="${esc(t.side)} ${esc(String(t.rungs[0].quantity))} at ${fmtPrice(price)} (${Number(t.rungs[0].offset_pct)}%)">${esc(t.name)}</button>`;
  }

  function paintTemplates() {
    const box = document.getElementById('trade-templates');
    if (!box || !tradeQuote) return;
    paneList = paneItems();
    const singles = [], ladders = [];
    paneList.forEach((it, i) => (it.saved && tplIsLadder(it.saved) ? ladders : singles).push(i));
    box.innerHTML = singles.map(paneChip).join('')
      + (ladders.length ? `<div class="tpl-chip-label">Ladders and straddles: pick an account above, then a ladder to preview it here</div>${ladders.map(paneChip).join('')}` : '');
    box.querySelectorAll('button').forEach(button => button.addEventListener('click', () => pickTemplate(Number(button.dataset.pick), button)));
  }

  function pickTemplate(i, button) {
    const it = paneList[i];
    if (!it) return;
    if (it.policy) { clearPaneLadder(); return applyTemplate(it.policy, button); }
    const t = it.saved;
    if (tplIsLadder(t)) return startPaneLadder(t, button);
    clearPaneLadder();
    const offset = Number(t.rungs[0].offset_pct);
    const same = ((tradeQuote && tradeQuote.templates) || []).find(q => q.side === t.side && Math.abs(Number(q.offset_pct) - offset) < 1e-9);
    applyTemplate({name: t.name, side: t.side, offset_pct: offset, price: same ? same.price : paneRungPrice(tradeQuote.mark, offset),
      tif: t.tif, session: t.session, quantity: Number(t.rungs[0].quantity)}, button);
  }

  function clearPaneLadder() {
    panePreview = null; paneResult = null;
    const box = document.getElementById('trade-ladder');
    if (box) box.innerHTML = '';
  }

  async function startPaneLadder(t, button) {
    const form = document.getElementById('trade-form');
    tradeFail('');
    if (!form) return;
    const account = form.elements.account ? form.elements.account.value : '';
    if (!isCrypto()) {
      if (!account) { tradeFail('Choose the account first, then pick the ladder.'); form.elements.account.focus(); return; }
      if (account.startsWith('fid:')) { tradeFail('Ladders go to Schwab accounts and Binance.US coins; Fidelity has no order API.'); return; }
    }
    clearPaneLadder();
    document.querySelectorAll('#trade-templates button').forEach(b => b.classList.toggle('active', b === button));
    try {
      panePreview = await sendOrder('POST', '/api/tradility-trade/batch/preview', ladderBody(t, detailTicker, account));
      renderPreview(LADDER_PANE);
    } catch (err) { tradeFail(err.message); }
  }

  // After the ticket is rebuilt: show this ticker's pending preview or last result again, never another's.
  function paintPaneLadder() {
    if (panePreview && panePreview.ticker === detailTicker) { renderPreview(LADDER_PANE); return; }
    panePreview = null;
    const box = document.getElementById('trade-ladder');
    if (box && paneResult && paneResult.ticker === detailTicker) box.innerHTML = paneResult.html;
    else paneResult = null;
  }

  document.getElementById('tpl-new').addEventListener('click', () => {
    tplDraft = tplBlank(); tplPreview = null; renderBuilder(); renderRun(); renderSaved();
  });

  loadData().then(() => {
    startLive();
    if (location.hash === '#templates') showView('templates');
    const requestedRange = new URLSearchParams(window.location.search).get('range');
    if (IS_POPOUT && RANGES.includes(requestedRange)) detailRange = requestedRange;
    const requestedTicker = new URLSearchParams(window.location.search).get('ticker');
    if (!requestedTicker) return;
    const normalized = requestedTicker.toUpperCase();
    const trigger = [...document.querySelectorAll('.ticker-card')]
      .find(card => card.dataset.ticker === normalized && !card.disabled);
    if (trigger) openTickerDetail(normalized, trigger);
  });
</script>
</body>
</html>
