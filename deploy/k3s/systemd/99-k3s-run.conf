# The 99- prefix matters: systemd applies drop-ins in name order and the last ExecStart= wins, so this must sort after
# any other drop-in that replaces ExecStart (one unit already had a 90- interpreter override).
# Installed by deploy/k3s/handover.sh pod-on; removed by pod-off. Only ExecStart changes: the job guard, the resource arbiter,
# the time limit and any post-step in the other drop-ins still apply.
[Service]
Environment=KUBECONFIG=%h/.kube/k3s.yaml KUBECTL=__KUBECTL__
ExecStart=
ExecStart=/usr/bin/env bash __REPO__/deploy/k3s/run-job.sh
