# The template for one refresh run. It is never scheduled: the host's weekday timer (with the job guard and resource
# limits) triggers each run through deploy/k3s/run-job.sh, which creates a Job from this CronJob. The schedule below is
# Feb 31st, which never occurs, and suspend stays true.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tradility-refresh
  namespace: tradility
spec:
  schedule: "0 0 31 2 *"
  suspend: true                      # always suspended: only a template for run-job.sh
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0                # a failed refresh is reported, not retried against the market-data hosts
      activeDeadlineSeconds: 1500
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: {app: tradility-refresh}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          # curl's resolver (c-ares, used by yfinance) gives up when the egress policy refuses the first
          # search-domain variant of a name (host.tradility.svc.cluster.local); with ndots 1 it asks for the
          # real name first, as glibc effectively does.
          dnsConfig:
            options: [{name: ndots, value: "1"}]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000     # the owner's uid: the exports folder is theirs and mode 0700
            runAsGroup: 1000
            # No fsGroup: on a local volume it would recursively change the group of the real files.
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: refresh
              image: localhost:5000/tradility:k3s
              imagePullPolicy: Always
              env:
                - {name: TRADILITY_HOLDINGS_FILE, value: /holdings/holdings-aggregate.json}
                - {name: TRADILITY_HISTORY_PERIOD, value: 5y}
                - {name: TRADILITY_MARKET_SOURCE, value: auto}
                # The pod has no broker credentials, so it does not fetch orders: the host's tradility-orders
                # timer keeps that file, and the pod rebuilds the actual-performance view from it.
                - {name: TRADILITY_FETCH_ORDERS, value: "0"}
                - {name: TRADILITY_FETCH_ACTUALS, value: "1"}
                # A short-lived Schwab access token, resolved on the host shortly before the run (the pod
                # cannot reach the vault). Absent or expired, the run falls back to Yahoo and says so.
                - name: TRADILITY_SCHWAB_ACCESS_TOKEN
                  valueFrom:
                    secretKeyRef: {name: tradility-schwab, key: access_token, optional: true}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: exports, mountPath: /exports}
                - {name: holdings, mountPath: /holdings, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: exports
              persistentVolumeClaim: {claimName: exports}
            - name: holdings
              persistentVolumeClaim: {claimName: holdings, readOnly: true}
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
